name: deploy

# Run from the Actions tab: "Run workflow" on the main branch.
# plan -> apply -> bootstrap search index -> deploy app -> smoke test
on:
  workflow_dispatch:
    inputs:
      location:
        description: Azure region (needs the chat and embedding models)
        default: swedencentral
        required: true
      plan_only:
        description: Only show the plan, do not create anything
        type: boolean
        default: false

# Never run two deploys/destroys at the same time against the same state.
concurrency:
  group: school-agent-infra
  cancel-in-progress: false

permissions:
  id-token: write # OIDC login to Azure
  contents: read

env:
  # Repository variables set by scripts/setup-oidc.sh (identifiers, not secrets).
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_location: ${{ inputs.location }}
  TF_IN_AUTOMATION: "true"
  # Optional hardening, driven by repository variables (all unset = off):
  TF_VAR_enable_private_networking: ${{ vars.ENABLE_PRIVATE_NETWORKING == 'true' }}
  TF_VAR_enable_easy_auth: ${{ vars.EASY_AUTH_CLIENT_ID != '' }}
  TF_VAR_easy_auth_client_id: ${{ vars.EASY_AUTH_CLIENT_ID }}
  TF_VAR_easy_auth_identity_id: ${{ vars.EASY_AUTH_IDENTITY_ID }}
  TF_VAR_easy_auth_identity_client_id: ${{ vars.EASY_AUTH_IDENTITY_CLIENT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false # so `terraform output -raw` is clean

      - name: Terraform init (remote state)
        working-directory: infra
        run: |
          STATE_RG=$(az storage account show --name "${{ vars.TFSTATE_STORAGE_ACCOUNT }}" --query resourceGroup -o tsv)
          terraform init -input=false \
            -backend-config="resource_group_name=$STATE_RG" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate"

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: ${{ !inputs.plan_only }}
        working-directory: infra
        run: terraform apply -input=false -auto-approve tfplan

      # GitHub's login token is only valid for 5 minutes, and the apply above can take longer
      # (OpenAI and Search are slow to create). Log in again so the az commands below get a fresh one.
      - name: Azure login (refresh)
        if: ${{ !inputs.plan_only }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Bootstrap search (upload docs, index, indexer)
        if: ${{ !inputs.plan_only }}
        run: ./scripts/bootstrap-search.sh

      - name: Azure login (refresh before app deploy)
        if: ${{ !inputs.plan_only }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the web app
        if: ${{ !inputs.plan_only }}
        run: |
          RG=$(terraform -chdir=infra output -raw resource_group_name)
          APP=$(terraform -chdir=infra output -raw web_app_name)
          (cd app && zip -qr ../app.zip . -x '.venv/*' '__pycache__/*')
          # App Service builds it (SCM_DO_BUILD_DURING_DEPLOYMENT=true) and starts gunicorn.
          # The CLI's own "wait until the site has started" check kept reporting "Starting the site..."
          # for 10 minutes and then failed, although the site was answering fine. So upload without
          # waiting (--async) and check the site ourselves: wait until /health answers 200.
          az webapp deploy --resource-group "$RG" --name "$APP" --src-path app.zip --type zip --async true
          URL=$(terraform -chdir=infra output -raw web_app_url)
          echo "Upload accepted. Waiting for $URL/health (up to 15 minutes) ..."
          sleep 45 # give the restart time to begin, so we do not read the old container's answer
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$URL/health" || true)
            echo "  [$i] /health -> ${code:-none}"
            if [ "$code" = "200" ]; then
              echo "The web app is up."
              exit 0
            fi
            sleep 20
          done
          echo "The web app did not become healthy in time. Check: az webapp log startup show -n $APP -g $RG" >&2
          exit 1

      - name: Smoke test
        if: ${{ !inputs.plan_only }}
        env:
          # With Easy Auth on, the chat API needs a sign-in, so the test checks that it is protected.
          EXPECT_AUTH: ${{ vars.EASY_AUTH_CLIENT_ID != '' }}
        run: ./scripts/smoke-test.sh "$(terraform -chdir=infra output -raw web_app_url)"

      - name: Summary
        if: ${{ !inputs.plan_only }}
        run: |
          echo "### Demo is up" >> "$GITHUB_STEP_SUMMARY"
          echo "$(terraform -chdir=infra output -raw web_app_url)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run the **destroy** workflow when you are done to stop the costs." >> "$GITHUB_STEP_SUMMARY"
